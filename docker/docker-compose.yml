version: '3.8'

services:
  # -------------------------------------------------------------
  # 1. LiveKit SFU Media Server
  # -------------------------------------------------------------
  livekit:
    image: livekit/livekit-server:v1.8.3
    container_name: nexora-livekit
    restart: unless-stopped
    network_mode: host
    environment:
      - LIVEKIT_KEYS=${LIVEKIT_API_KEY:-devkey}: ${LIVEKIT_API_SECRET}
      - LIVEKIT_REDIS_ADDRESS=${REDIS_HOST:-127.0.0.1}:6379
      - LIVEKIT_REDIS_PASSWORD=${REDIS_PASSWORD}
      - LIVEKIT_WEBHOOK_URLS=${BACKEND_INTERNAL_WEBHOOK_URL:-http://127.0.0.1:4000/v1/webhooks/livekit}
      - LIVEKIT_WEBHOOK_API_KEY=${LIVEKIT_API_KEY:-devkey}
    volumes:
      - ./livekit.prod.yaml:/etc/livekit.yaml:ro
    command: --config /etc/livekit.yaml
    depends_on:
      - redis

  # -------------------------------------------------------------
  # 2. Redis (Cluster Coordination & Session Cache)
  # -------------------------------------------------------------
  redis:
    image: redis:7.2-alpine
    container_name: nexora-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    ports:
      - "127.0.0.1:6379:6379" # Bind strictly to loopback interface
    volumes:
      - redis-data:/data

  # -------------------------------------------------------------
  # 3. Coturn STUN / TURN Server (NAT Traversal for Enterprise Firewalls)
  # -------------------------------------------------------------
  coturn:
    image: coturn/coturn:4.6.3-alpine
    container_name: nexora-coturn
    restart: unless-stopped
    network_mode: host
    environment:
      - TURN_STATIC_AUTH_SECRET=${TURN_STATIC_AUTH_SECRET}
    volumes:
      - ./turnserver.conf:/etc/coturn/turnserver.conf:ro
    command: -c /etc/coturn/turnserver.conf

  # -------------------------------------------------------------
  # 4. LiveKit Egress Worker (Headless Chromium + FFmpeg transcoding)
  # -------------------------------------------------------------
  egress:
    image: livekit/egress:v1.8.8
    container_name: nexora-egress
    restart: unless-stopped
    network_mode: host
    ipc: host
    cap_add:
      - SYS_ADMIN
    environment:
      - EGRESS_CONFIG_FILE=/etc/egress.yaml
      - EGRESS_API_KEY=${LIVEKIT_API_KEY:-devkey}
      - EGRESS_API_SECRET=${LIVEKIT_API_SECRET}
      - EGRESS_REDIS_HOST=${REDIS_HOST:-127.0.0.1}
      - EGRESS_REDIS_PORT=6379
      - EGRESS_REDIS_PASSWORD=${REDIS_PASSWORD}
    volumes:
      - ./egress.yaml:/etc/egress.yaml:ro
    depends_on:
      - livekit
      - redis

volumes:
  redis-data:
