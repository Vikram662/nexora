version: '3.8'

services:
  # -------------------------------------------------------------
  # 1. LiveKit SFU Media Server
  # -------------------------------------------------------------
  livekit:
    image: livekit/livekit-server:latest
    container_name: nexora-livekit
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./livekit.prod.yaml:/etc/livekit.yaml:ro
    command: --config /etc/livekit.yaml
    depends_on:
      - redis

  # -------------------------------------------------------------
  # 2. Redis (Cluster Coordination & Session Cache)
  # -------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: nexora-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass nexora_redis_secret_2026
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  # -------------------------------------------------------------
  # 3. Coturn STUN / TURN Server (NAT Traversal for Enterprise Firewalls)
  # -------------------------------------------------------------
  coturn:
    image: coturn/coturn:latest
    container_name: nexora-coturn
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./turnserver.conf:/etc/coturn/turnserver.conf:ro
    command: -c /etc/coturn/turnserver.conf

volumes:
  redis-data:
