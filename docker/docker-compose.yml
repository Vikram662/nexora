version: '3.8'

services:
  # -------------------------------------------------------------
  # 1. LiveKit SFU Media Server
  # -------------------------------------------------------------
  livekit:
    image: livekit/livekit-server:v1.8.3
    container_name: nexora-livekit
    restart: unless-stopped
    network_mode: host
    environment:
      LIVEKIT_CONFIG_BODY: |
        port: 7880
        bind_addresses:
          - ""
        keys:
          ${LIVEKIT_API_KEY:-devkey}: ${LIVEKIT_API_SECRET}
        logging:
          json: true
          level: info
        redis:
          address: ${REDIS_HOST:-127.0.0.1}:6379
          password: ${REDIS_PASSWORD}
          db: 0
        rtc:
          tcp_port: 7881
          port_range_start: 50000
          port_range_end: 60000
          use_external_ip: true
          stun_servers:
            - stun.l.google.com:19302
            - stun1.l.google.com:19302
        webhook:
          api_key: ${LIVEKIT_API_KEY:-devkey}
          urls:
            - ${BACKEND_INTERNAL_WEBHOOK_URL:-http://127.0.0.1:4000/v1/webhooks/livekit}
    depends_on:
      - redis

  # -------------------------------------------------------------
  # 2. Redis (Cluster Coordination & Session Cache)
  # -------------------------------------------------------------
  redis:
    image: redis:7.2-alpine
    container_name: nexora-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    ports:
      - "127.0.0.1:6379:6379" # Bind strictly to loopback interface
    volumes:
      - redis-data:/data

  # -------------------------------------------------------------
  # 3. Coturn STUN / TURN Server (NAT Traversal for Enterprise Firewalls)
  # -------------------------------------------------------------
  coturn:
    image: coturn/coturn:4.6.3-alpine
    container_name: nexora-coturn
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./turnserver.conf:/etc/coturn/turnserver.conf:ro
    command: -c /etc/coturn/turnserver.conf --static-auth-secret=${TURN_STATIC_AUTH_SECRET}

  # -------------------------------------------------------------
  # 4. LiveKit Egress Worker (Headless Chromium + FFmpeg transcoding)
  # -------------------------------------------------------------
  egress:
    image: livekit/egress:v1.8.8
    container_name: nexora-egress
    restart: unless-stopped
    network_mode: host
    ipc: host
    cap_add:
      - SYS_ADMIN
    environment:
      EGRESS_CONFIG_BODY: |
        api_key: ${LIVEKIT_API_KEY:-devkey}
        api_secret: ${LIVEKIT_API_SECRET}
        ws_url: ws://127.0.0.1:7880
        redis:
          address: ${REDIS_HOST:-127.0.0.1}:6379
          password: ${REDIS_PASSWORD}
          db: 0
        logging:
          level: info
    depends_on:
      - livekit
      - redis

volumes:
  redis-data:
