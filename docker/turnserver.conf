# Coturn STUN/TURN Configuration for Nexora RTC PaaS
listening-port=3478
tls-listening-port=5349

# Min and max media relay ports
min-port=49152
max-port=65535

# Authentication
lt-cred-mech
use-auth-secret
static-auth-secret=${TURN_STATIC_AUTH_SECRET}
realm=rtc.nexora.io

# External relay IP for NAT traversal
# external-ip=YOUR_PUBLIC_SERVER_IP

# TLS Certificates (for port 5349)
# cert=/etc/coturn/certs/turn_server_cert.pem
# pkey=/etc/coturn/certs/turn_server_pkey.pem

# Security
stale-nonce=600
fingerprint
no-loopback-peers
no-multicast-peers

log-file=stdout
simple-log
