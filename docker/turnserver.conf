# Coturn STUN/TURN Configuration for Nexora RTC PaaS
listening-port=3478
tls-listening-port=5349

# Min and max media relay ports
min-port=49152
max-port=65535

# Authentication
lt-cred-mech
use-auth-secret
static-auth-secret=nexora_turn_master_secret_2026
realm=rtc.nexora.io

# Security
no-tcp-relay
stale-nonce=600
fingerprint
no-loopback-peers
no-multicast-peers

log-file=stdout
simple-log
