port: 7880
bind_addresses:
  - ""

# Nexora RTC Control Plane Master Key
keys:
  devkey: ${LIVEKIT_API_SECRET}

logging:
  json: true
  level: info

# Distributed Redis for Multi-Node Scaling
redis:
  address: ${REDIS_HOST:-127.0.0.1}:6379
  password: ${REDIS_PASSWORD}
  db: 0

# WebRTC & Media Ports
rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 60000
  use_external_ip: true
  stun_servers:
    - stun.l.google.com:19302
    - stun1.l.google.com:19302

# Webhook to dispatch room events to Nexora Backend
webhook:
  api_key: devkey
  urls:
    - ${BACKEND_INTERNAL_WEBHOOK_URL:-http://127.0.0.1:4000/v1/webhooks/livekit}
